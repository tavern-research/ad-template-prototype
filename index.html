              {picker === "video" && !atCap ? (
                <Stack gap={8}>
                  <Row align="center" gap={8} wrap style={{ rowGap: 8 }}>
                    <Text size="small" tone="tertiary" style={{ flex: 1, minWidth: 180 }}>{isQuick ? <React.Fragment>Pull a winning video's <span style={{ fontWeight: 600 }}>script</span> into a row, or copy its full recipe into the shared panel above with <span style={{ fontWeight: 600 }}>Use recipe for all videos</span>.</React.Fragment> : <React.Fragment>Pull a winning video to <span style={{ fontWeight: 600 }}>prefill the whole recipe</span> — script, voiceover, soundtrack, creative, skill and visual. Every field stays editable.</React.Fragment>}</Text>
                    <Button variant="secondary" disabled={atCap} onClick={isQuick ? addAllVideosScriptOnly : addAllVideos}>{isQuick ? "Add all winning scripts" : "Add all winning videos"}</Button>
                  </Row>
                  <Stack gap={6}>
                    {VIDEOS.map((v) => (
                      <div key={v.id} style={{ border: "1px solid " + theme.stroke.tertiary, borderRadius: 10, padding: 10 }}>
                        <Row gap={10} align="center" wrap style={{ rowGap: 8 }}>
                          <div style={{ flex: 1, minWidth: 200 }}>
                            <Row gap={6} align="center">
                              <Text size="small" weight="semibold" truncate>{v.title}</Text>
                              <Pill size="sm" active tone={v.badgeTone}>{v.badge}</Pill>
                            </Row>
                            <Text size="small" tone="tertiary" truncate>{v.category} · CTR {v.ctr} · {v.views} views</Text>
                            <Text size="small" truncate style={{ marginTop: 2 }}>“{v.script.text}”</Text>
                            <Row gap={6} align="center" style={{ marginTop: 4 }}>
                              <span style={{ color: theme.text.tertiary, display: "flex" }}><ElIcon type="voiceover" size={12} /></span>
                              <Text size="small" tone="secondary" truncate>{v.voiceover.artist} — {v.voiceover.provider} · {v.soundtrack.name} · {v.skill.name}</Text>
                            </Row>
                          </div>
                          {isQuick ? (
                            <Row gap={6} wrap style={{ rowGap: 6 }}>
                              <Button variant="secondary" disabled={atCap} onClick={() => addVideoScriptOnly(v)}>Add script</Button>
                              <Button variant="ghost" onClick={() => useRecipeForAll(v)}>Use recipe for all videos</Button>
                            </Row>
                          ) : (
                            <Button variant="secondary" disabled={atCap} onClick={() => addVideo(v)}>Add full recipe</Button>
                          )}
                        </Row>
                      </div>
                    ))}
                  </Stack>
                </Stack>
              ) : null}

              {picker === "library" && !atCap ? (
                <Stack gap={8}>
                  <Row align="center" gap={8} wrap style={{ rowGap: 8 }}>
                    <Text size="small" tone="tertiary" style={{ flex: 1, minWidth: 180 }}>Start from just a script — the video will need a voiceover (generate or upload) and you can fill in the rest.</Text>
                    <Button variant="secondary" disabled={atCap} onClick={addAllLibrary}>Add all library scripts</Button>
                  </Row>
                  <Stack gap={6}>
                    {LIBRARY_SCRIPTS.map((s) => <OptionRow key={s.id} title={s.title} subtitle={s.text} actionLabel="Add script only" onClick={() => addLibrary(s)} />)}
                  </Stack>
                </Stack>
              ) : null}

              {picker === "custom" && !atCap ? (
                <Stack gap={8}>
                  <TextArea value={custom} onChange={setCustom} rows={3} placeholder="Write or paste a script — you'll build the rest of the recipe on the card…" />
                  <Row gap={8}><Button variant="primary" disabled={!custom.trim()} onClick={addCustom}>Add video</Button></Row>
                </Stack>
              ) : null}

              {picker === "upScript" ? (
                <Stack gap={8}>
                  <Text size="small" tone="tertiary">Drop a <span style={{ fontWeight: 600 }}>.csv</span>, <span style={{ fontWeight: 600 }}>.txt</span>, or <span style={{ fontWeight: 600 }}>.docx</span> file. Each parsed script becomes a row that still needs a voiceover (unless a matching audio file is uploaded next).</Text>
                  {atCap ? <Text size="small" tone="tertiary">Bulk cap reached — remove a video first to import more scripts.</Text> : (
                    <DropZone accept=".csv,.txt,.docx" onFiles={(arr) => handleScriptsFile(arr[0])} label="Drop a scripts file or click to browse" hint=".csv (script/text + optional title/id columns) · .txt (paragraphs or one-per-line) · .docx (preview parse)" />
                  )}
                  <Text size="small" tone="tertiary">CSV with a header uses the <span style={{ fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace" }}>script</span>/<span style={{ fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace" }}>text</span> column for the script and <span style={{ fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace" }}>title</span>/<span style={{ fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace" }}>id</span> for the row title. Plain CSV uses the first cell as script, second cell as title. .docx import is simulated in the prototype — server-side in production.</Text>
                </Stack>
              ) : null}

              {picker === "upVoice" ? (
                <Stack gap={8}>
                  <Text size="small" tone="tertiary">Drop one or more audio files. Filenames that match an existing row's title (case-insensitive, ignoring punctuation/spaces/extension) attach the voiceover to that row; unmatched files become new script-blank rows tagged <span style={{ fontWeight: 600 }}>Uploaded</span>.</Text>
                  <DropZone accept="audio/*,.mp3,.wav,.m4a,.ogg" multiple={true} onFiles={handleAudioFiles} label="Drop audio files or click to browse (multi-select)" hint=".mp3 · .wav · .m4a · .ogg — match by filename to attach to existing rows" disabled={isQuick} disabledReason="Multi-audio upload is a Per-video feature — switch to Per-video customization to attach unique voices per video. (The shared voiceover above applies to every script in Quick batch mode; you can also Upload a single voiceover there to use across all videos.)" />
                  {atCap ? <Text size="small" tone="tertiary">Bulk cap reached — only audio that pairs with an existing row will attach; unmatched files will be skipped.</Text> : null}
                </Stack>
              ) : null}

              {uploadStatus ? (
                <Callout tone={uploadStatus.tone}>
                  <Row align="center" gap={8}>
                    <Text size="small" style={{ flex: 1 }}>{uploadStatus.text}</Text>
                    <IconButton title="Dismiss" size="sm" onClick={() => setUploadStatus(null)}>✕</IconButton>
                  </Row>
                </Callout>
              ) : null}
            </Stack>
          </CardBody>
        </Card>

        {note ? (
          <Callout tone="warning">
            <Row align="center" gap={8}>
              <Text size="small" style={{ flex: 1 }}>{note}</Text>
              <IconButton title="Dismiss" size="sm" onClick={() => setNote("")}>✕</IconButton>
            </Row>
          </Callout>
        ) : null}

        {rows.length === 0 ? (
          <Callout tone="neutral" title="No videos yet">Add videos above — pull a winning video to prefill the whole recipe, add a library script, or start from scratch. Each video expands into a Library-style six-ingredient editor.</Callout>
        ) : (
          <Stack gap={10}>
            <Row align="center" gap={8} wrap style={{ rowGap: 8 }}>
              <Text size="small" tone="secondary" weight="medium">{rows.length} {rows.length === 1 ? "video" : "videos"}</Text>
              {!isQuick && missing > 0 ? <Pill size="sm" active tone="warning">{missing} need{missing === 1 ? "s" : ""} voiceover</Pill> : null}
              {isQuick ? <Pill size="sm" active tone="info">Shared recipe applies to all</Pill> : null}
              <Spacer />
              <Button variant="ghost" onClick={() => setAllExpanded(true)}>Expand all</Button>
              <Button variant="ghost" onClick={() => setAllExpanded(false)}>Collapse all</Button>
            </Row>
            {rows.map((r, i) => {
              const showWarn = !isQuick && !r.voice;
              const cardBorder = r.expanded ? theme.accent.primary : (showWarn ? TONE.warning + "88" : theme.stroke.secondary);
              const editorBoxStyle = { background: theme.fill.quaternary, borderRadius: 9, padding: 10 };
              return (
                <div key={r.id} style={{ border: "1px solid " + cardBorder, borderRadius: 12, background: showWarn && !r.expanded ? TONE.warning + "0D" : theme.bg.elevated, padding: 12 }}>
                  <Row gap={12} align="center" wrap style={{ rowGap: 10 }}>
                    <NumberBadge n={i + 1} />
                    <div onClick={() => toggleExpand(r.id)} style={{ flex: 1, minWidth: 200, cursor: "pointer" }}>
                      <Row gap={6} align="center">
                        <span style={{ color: theme.text.tertiary, display: "flex", flexShrink: 0, transform: r.expanded ? "rotate(90deg)" : "none", transition: "transform 120ms ease" }}>
                          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><polyline points="6,4 10,8 6,12" /></svg>
                        </span>
                        <Text weight="medium" truncate>{r.title || "Untitled video"}</Text>
                        {!isQuick && r.voice && r.voice.origin === "video" ? <Pill size="sm" active tone="info">{bulkOriginLabel(r.voice)}</Pill> : null}
                      </Row>
                      <Text size="small" tone="tertiary" truncate>{r.text || "No script yet"}</Text>
                    </div>
                    {isQuick ? (
                      <Pill size="sm" active tone="info" leadingContent={<ElIcon type="skill" size={11} />}>Uses shared recipe</Pill>
                    ) : (
                      <Row gap={6} align="center" style={{ flexShrink: 0 }}>
                        {[["voiceover", !!r.voice], ["soundtrack", !!r.soundtrack], ["creative", r.creative.trim().length > 0], ["visual", !!r.visual]].map(([t, on]) => (
                          <span key={t} title={TYPE_LABEL[t] + (on ? " · set" : " · not set")} style={{ color: on ? theme.accent.primary : theme.text.quaternary, display: "flex" }}><ElIcon type={t} size={13} /></span>
                        ))}
                        <Pill size="sm" active={r.skills.length > 0} tone={r.skills.length > 0 ? "info" : "neutral"} leadingContent={<ElIcon type="skill" size={11} />}>{r.skills.length} skill{r.skills.length === 1 ? "" : "s"}</Pill>
                      </Row>
                    )}
                    {!isQuick && (r.voice ? (
                      <Pill size="sm" active tone={r.voice.status === "generating" ? "neutral" : BULK_ORIGIN_TONE[r.voice.origin]}>{r.voice.status === "generating" ? "Generating…" : bulkOriginLabel(r.voice)}</Pill>
                    ) : (
                      <Pill size="sm" active tone="warning" leadingContent={<ElIcon type="voiceover" size={11} />}>Needs voiceover</Pill>
                    ))}
                    <Button variant="ghost" onClick={() => toggleExpand(r.id)}>{r.expanded ? "Close" : "Edit"}</Button>
                    <IconButton title="Remove video" size="sm" onClick={() => removeRow(r.id)}>✕</IconButton>
                  </Row>

                  {r.expanded ? (
                    <div style={{ marginTop: 12, borderTop: "1px solid " + theme.stroke.tertiary, paddingTop: 14 }}>
                      <Stack gap={14}>

                        {r.videoId ? <Poster v={r} /> : null}
                        {r.videoId ? (
                          <Stack gap={4}>
                            <Text weight="semibold">{r.title}</Text>
                            <Text size="small" tone="tertiary">{r.category}</Text>
                          </Stack>
                        ) : null}
                        {r.videoId && r.ctr ? (
                          <Row gap={8} wrap>
                            <PerfStat label="CTR" value={r.ctr} accent />
                            <PerfStat label="Views" value={r.views} />
                            <PerfStat label="Watch-through" value={r.vtr} />
                          </Row>
                        ) : null}
                        {r.videoId ? <Divider /> : null}

                        <Row align="center">
                          <Text size="small" tone="secondary" weight="medium">{isQuick ? "Script" : "Recipe"}</Text>
                          <Spacer />
                          <Text size="small" tone="tertiary">{isQuick ? "Uses shared recipe for everything else" : "6 ingredients"}</Text>
                        </Row>

                        {isQuick ? (
                          <Callout tone="info">This card uses the <span style={{ fontWeight: 600 }}>Shared recipe</span> above for voiceover, soundtrack, creative direction, skills, and visual style. Switch to <span style={{ fontWeight: 600 }}>Per-video customization</span> to override any of those for this script.</Callout>
                        ) : null}

                        <ScriptVoicePlayer row={isQuick ? { ...r, voice: shared.voice } : r} />

                        {/* SCRIPT */}
                        <Stack gap={8}>
                          <Row align="center">
                            <GroupLabel type="script" />
                            <Spacer />
                            <Pill size="sm" active={r.editing === "script"} onClick={() => setEditing(r.id, "script")}>{r.editing === "script" ? "Done" : "Swap"}</Pill>
                          </Row>
                          <TextInput value={r.title} onChange={(val) => updateRow(r.id, { title: val })} placeholder="Video title" />
                          <TextArea value={r.text} onChange={(val) => updateRow(r.id, { text: val })} rows={3} placeholder="What should this video say?" />
                          {r.editing === "script" ? (
                            <Stack gap={8} style={editorBoxStyle}>
                              <Text size="small" tone="tertiary" weight="medium">Use a winning video's script</Text>
                              <Stack gap={6}>{VIDEOS.map((v) => <OptionRow key={v.id} title={v.title} subtitle={v.script.text} actionLabel="Use" onClick={() => useVideoScript(r.id, v)} />)}</Stack>
                              <Divider />
                              <Text size="small" tone="tertiary" weight="medium">Or pick a library script</Text>
                              <Stack gap={6}>{LIBRARY_SCRIPTS.map((s) => <OptionRow key={s.id} title={s.title} subtitle={s.text} actionLabel="Use" onClick={() => useLibScript(r.id, s)} />)}</Stack>
                            </Stack>
                          ) : null}
                        </Stack>

                        {!isQuick ? (<React.Fragment>
                        <Divider />

                        {/* VOICEOVER */}
                        <Stack gap={8}>
                          <Row align="center">
                            <GroupLabel type="voiceover" />
                            <Spacer />
                            <Pill size="sm" active={r.editing === "voiceover"} onClick={() => setEditing(r.id, "voiceover")}>{r.editing === "voiceover" ? "Done" : (r.voice ? "Swap" : "Pick")}</Pill>
                          </Row>
                          {r.voice ? (
                            <Row gap={8} align="center" wrap style={{ rowGap: 6 }}>
                              <span style={{ color: theme.text.tertiary, display: "flex", flexShrink: 0 }}><ElIcon type="voiceover" size={13} /></span>
                              <Text size="small" truncate style={{ flex: 1, minWidth: 0 }}>{r.voice.value}</Text>
                              {r.voice.status === "generating" ? <Pill size="sm" tone="neutral">Generating…</Pill> : <Pill size="sm" active tone={BULK_ORIGIN_TONE[r.voice.origin]}>{bulkOriginLabel(r.voice)}</Pill>}
                            </Row>
                          ) : (
                            <Pill size="sm" active tone="warning" leadingContent={<ElIcon type="voiceover" size={11} />}>Needs voiceover</Pill>
                          )}
                          {(r.editing === "voiceover" || !r.voice) ? (
                            <Stack gap={10} style={editorBoxStyle}>
                              <Stack gap={6}>
                                <Text size="small" tone="tertiary" weight="medium">Pick from the roster</Text>
                                <Row gap={8} align="center" wrap style={{ rowGap: 8 }}>
                                  <div style={{ flex: 1, minWidth: 200 }}><Select value={voDraft} onChange={setVoDraft} options={VO_OPTIONS} /></div>
                                  <Button variant="secondary" onClick={() => assignRoster(r.id, voDraft)}>Assign</Button>
                                </Row>
                              </Stack>
                              <Divider />
                              <Stack gap={6}>
                                <Text size="small" tone="tertiary" weight="medium">Generate with TTS using the picked roster voice</Text>
                                <Row><Button variant="secondary" onClick={() => startGenerate(r.id)}>Generate voiceover</Button></Row>
                              </Stack>
                              <Divider />
                              <Stack gap={6}>
                                <Text size="small" tone="tertiary" weight="medium">Upload your own</Text>
                                <MockUpload stateKey={"bulk.vo." + r.id} currentFile="" placeholder="my-vo-take3.mp3" suggestions={MOCK_VO_FILES} onUpload={(f) => uploadVoice(r.id, f)} />
                              </Stack>
                              <Divider />
                              <Stack gap={6}>
                                <Text size="small" tone="tertiary" weight="medium">Use a winning video's voiceover</Text>
                                <Stack gap={6}>{VIDEOS.map((v) => <OptionRow key={v.id} title={v.title} subtitle={v.voiceover.artist + " — " + v.voiceover.provider} actionLabel="Use" onClick={() => useVideoVoice(r.id, v)} />)}</Stack>
                              </Stack>
                              {r.voice ? <Row><Button variant="ghost" onClick={() => { clearVoice(r.id); closeEditing(r.id); }}>Clear voiceover</Button></Row> : null}
                            </Stack>
                          ) : null}
                        </Stack>

                        <Divider />

                        {/* SOUNDTRACK */}
                        <Stack gap={8}>
                          <Row align="center">
                            <GroupLabel type="soundtrack" />
                            <Spacer />
                            <Pill size="sm" active={r.editing === "soundtrack"} onClick={() => setEditing(r.id, "soundtrack")}>{r.editing === "soundtrack" ? "Done" : (r.soundtrack ? "Swap" : "Pick")}</Pill>
                          </Row>
                          {r.soundtrack ? (
                            <Row gap={8} align="center" wrap style={{ rowGap: 6 }}>
                              <span style={{ color: theme.text.tertiary, display: "flex", flexShrink: 0 }}><ElIcon type="soundtrack" size={13} /></span>
                              <Text size="small" truncate style={{ flex: 1, minWidth: 0 }}>{r.soundtrack.value}</Text>
                              <Pill size="sm" active tone={r.soundtrack.origin === "uploaded" ? "info" : "neutral"}>{r.soundtrack.origin === "uploaded" ? "Uploaded" : "Library"}</Pill>
                              <Button variant="ghost" onClick={() => clearSoundtrack(r.id)}>Remove</Button>
                            </Row>
                          ) : (
                            <Text size="small" tone="tertiary">No soundtrack — pick one or leave silent.</Text>
                          )}
                          {r.editing === "soundtrack" ? (
                            <Stack gap={10} style={editorBoxStyle}>
                              <Stack gap={6}>
                                <Text size="small" tone="tertiary" weight="medium">Pick from the track library</Text>
                                <Stack gap={6}>{TRACK_LIBRARY.map((t) => <OptionRow key={t.id} title={t.name} subtitle={t.mood} actionLabel="Use" onClick={() => setSoundtrackLibrary(r.id, t)} />)}</Stack>
                              </Stack>
                              <Divider />
                              <Stack gap={6}>
                                <Text size="small" tone="tertiary" weight="medium">Upload audio</Text>
                                <MockUpload stateKey={"bulk.snd." + r.id} currentFile="" placeholder="campaign-bed-loop.mp3" suggestions={MOCK_AUDIO_FILES} onUpload={(f) => setSoundtrackUpload(r.id, f)} />
                              </Stack>
                              <Divider />
                              <Stack gap={6}>
                                <Text size="small" tone="tertiary" weight="medium">Use a winning video's soundtrack</Text>
                                <Stack gap={6}>{VIDEOS.map((v) => <OptionRow key={v.id} title={v.title} subtitle={v.soundtrack.name + " · " + v.soundtrack.mood} actionLabel="Use" onClick={() => useVideoTrack(r.id, v)} />)}</Stack>
                              </Stack>
                            </Stack>
                          ) : null}
                        </Stack>

                        <Divider />

                        {/* CREATIVE */}
                        <Stack gap={8}>
                          <Row align="center">
                            <GroupLabel type="creative" />
                            <Spacer />
                            <Pill size="sm" active={r.editing === "creative"} onClick={() => setEditing(r.id, "creative")}>{r.editing === "creative" ? "Done" : "Swap"}</Pill>
                          </Row>
                          <TextArea value={r.creative} onChange={(val) => updateRow(r.id, { creative: val })} rows={3} placeholder="Describe the look and tone in your own words…" />
                          {r.editing === "creative" ? (
                            <Stack gap={8} style={editorBoxStyle}>
                              <Text size="small" tone="tertiary" weight="medium">Use a winning video's creative direction</Text>
                              <Stack gap={6}>{VIDEOS.map((v) => <OptionRow key={v.id} title={v.title} subtitle={v.creative} actionLabel="Use" onClick={() => useVideoCreative(r.id, v)} />)}</Stack>
                            </Stack>
                          ) : null}
                        </Stack>

                        <Divider />

                        {/* SKILLS — multi */}
                        <Stack gap={8}>
                          <Row align="center" gap={8}>
                            <GroupLabel type="skill" />
                            <Spacer />
                            <Text size="small" tone="tertiary">{r.skills.length} attached</Text>
                            <Pill size="sm" active={r.editing === "skill"} onClick={() => setEditing(r.id, "skill")}>{r.editing === "skill" ? "Close" : "Add skills"}</Pill>
                          </Row>
                          {r.skills.length > 0 ? (
                            <Row gap={6} wrap style={{ rowGap: 6 }}>
                              {r.skills.map((sk) => <Pill key={sk} size="sm" active onClick={() => removeSkill(r.id, sk)}>{sk}  ✕</Pill>)}
                            </Row>
                          ) : (
                            <Text size="small" tone="tertiary">No skills attached yet — add one or more from the template library.</Text>
                          )}
                          {r.editing === "skill" ? (
                            <SkillMultiPicker
                              currentSkills={r.skills}
                              includeVideoSkills={true}
                              hint="Stage as many skills as you want — search to filter, tap rows to check/uncheck, then click Add to layer them on this video. (You don't need to leave Bulk Studio for this.)"
                              onAdd={(names) => addSkillsBulk(r.id, names)}
                              onCancel={() => closeEditing(r.id)}
                            />
                          ) : null}
                        </Stack>

                        <Divider />

                        {/* VISUAL */}
                        <Stack gap={8}>
                          <Row align="center">
                            <GroupLabel type="visual" />
                            <Spacer />
                            <Pill size="sm" active={r.editing === "visual"} onClick={() => setEditing(r.id, "visual")}>{r.editing === "visual" ? "Done" : "Swap"}</Pill>
                          </Row>
                          <Row gap={8} wrap style={{ rowGap: 8 }}>
                            <div style={{ flex: 1, minWidth: 130 }}>
                              <Text size="small" tone="tertiary" weight="medium" style={{ marginBottom: 4 }}>Format</Text>
                              <Select value={r.visual.format} onChange={(val) => setVisual(r.id, "format", val)} options={VISUAL_FORMATS.map((o) => ({ value: o, label: o }))} />
                            </div>
                            <div style={{ flex: 1, minWidth: 130 }}>
                              <Text size="small" tone="tertiary" weight="medium" style={{ marginBottom: 4 }}>Duration</Text>
                              <Select value={r.visual.duration} onChange={(val) => setVisual(r.id, "duration", val)} options={VISUAL_DURATIONS.map((o) => ({ value: o, label: o }))} />
                            </div>
                          </Row>
                          <Row gap={8} wrap style={{ rowGap: 8 }}>
                            <div style={{ flex: 1, minWidth: 130 }}>
                              <Text size="small" tone="tertiary" weight="medium" style={{ marginBottom: 4 }}>Color grade</Text>
                              <Select value={r.visual.grade} onChange={(val) => setVisual(r.id, "grade", val)} options={VISUAL_GRADES.map((o) => ({ value: o, label: o }))} />
                            </div>
                            <div style={{ flex: 1, minWidth: 130 }}>
                              <Text size="small" tone="tertiary" weight="medium" style={{ marginBottom: 4 }}>Captions</Text>
                              <Select value={r.visual.captions} onChange={(val) => setVisual(r.id, "captions", val)} options={VISUAL_CAPTIONS.map((o) => ({ value: o, label: o }))} />
                            </div>
                          </Row>
                          {r.editing === "visual" ? (
                            <Stack gap={8} style={editorBoxStyle}>
                              <Text size="small" tone="tertiary" weight="medium">Use a winning video's visual style</Text>
                              <Stack gap={6}>{VIDEOS.map((v) => <OptionRow key={v.id} title={v.title} subtitle={v.visual.format + " · " + v.visual.duration + " · " + v.visual.grade + " · " + v.visual.captions} actionLabel="Use" onClick={() => useVideoVisual(r.id, v)} />)}</Stack>
                            </Stack>
                          ) : null}
                        </Stack>
                        </React.Fragment>) : null}

                      </Stack>
                    </div>
                  ) : null}
                </div>
              );
            })}
          </Stack>
        )}

        <Card>
          <CardBody>
            <Row gap={12} align="center" wrap style={{ rowGap: 10 }}>
              <Stack gap={2}>
                <Text weight="semibold">Generate videos</Text>
                <Text size="small" tone="tertiary">{rows.length} {rows.length === 1 ? "video" : "videos"} · {isQuick ? "shared recipe applied to every script" : (missing + " still need a voiceover")}</Text>
              </Stack>
              <Spacer />
              {!isQuick && rows.length > 0 && missing > 0 ? <Pill size="sm" active tone="warning">{missing} unresolved</Pill> : null}
              {rows.length > 0 ? <Button variant="ghost" onClick={clearAll}>Clear all</Button> : null}
              <Button variant="primary" disabled={rows.length === 0} onClick={onGenerate}>Generate {rows.length} video{rows.length === 1 ? "" : "s"}</Button>
            </Row>
          </CardBody>
        </Card>
      </Stack>
    </div>
  );
}

/* ================================================================
   App shell — top tab switcher between the prototypes
   ================================================================ */
function App() {
  const [tab, setTab] = useState("library");
  const [pendingBulkSkills, setPendingBulkSkills] = useState(null);
  const tabs = [["library", "Winning Videos Library"], ["bulk", "Bulk Studio"], ["skills", "Skills"]];
  return (
    <div style={{ minHeight: "100vh", background: THEME.bg.editor }}>
      <div style={{ position: "sticky", top: 0, zIndex: 50, background: "rgba(255,255,255,0.78)", backdropFilter: "blur(12px)", WebkitBackdropFilter: "blur(12px)", borderBottom: "1px solid " + THEME.stroke.secondary, padding: "10px 20px", display: "flex", alignItems: "center", gap: 16 }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: THEME.text.primary }}>Tavern · UX Prototype</div>
        <div style={{ flex: 1 }} />
        <div style={{ display: "inline-flex", background: THEME.fill.secondary, borderRadius: 999, padding: 3, gap: 3 }}>
          {tabs.map(([id, label]) => (
            <button key={id} onClick={() => setTab(id)} style={{ border: "none", borderRadius: 999, padding: "7px 16px", fontSize: 13, fontWeight: 500, cursor: "pointer", background: tab === id ? "#fff" : "transparent", color: tab === id ? THEME.text.primary : THEME.text.secondary, boxShadow: tab === id ? "0 1px 2px rgba(0,0,0,0.08)" : "none", transition: "background 120ms ease" }}>{label}</button>
          ))}
        </div>
      </div>
      <div style={{ display: tab === "library" ? "block" : "none" }}><TemplateLibrary /></div>
      <div style={{ display: tab === "bulk" ? "block" : "none" }}><BulkVoiceovers pendingSkills={pendingBulkSkills} clearPendingSkills={() => setPendingBulkSkills(null)} /></div>
      <div style={{ display: tab === "skills" ? "block" : "none" }}><SkillsLibrary onUseSkills={(names) => { const list = Array.isArray(names) ? names.filter(Boolean) : (names ? [names] : []); if (!list.length) return; setPendingBulkSkills(list); setTab("bulk"); }} /></div>
    </div>
  );
}

const rootEl = document.getElementById("root");
rootEl.innerHTML = "";
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
